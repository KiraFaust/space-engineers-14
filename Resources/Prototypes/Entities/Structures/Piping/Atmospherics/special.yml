# Devices which are not portable but don't link up to anything
- type: entity
  id: AtmosDeviceFanTiny
  name: tiny fan
  description: A tiny fan, releasing a thin gust of air.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Pullable
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/tinyfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - DoorPassable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
  # _SE start
  - type: Construction
    graph: AtmosDeviceFanTiny
    node: fanDone
  - type: Pullable
  - type: Anchorable
  # _SE end

- type: entity
  id: AtmosDeviceFanDirectional
  name: directional fan
  description: A thin fan, stopping the movement of gases across it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Pullable
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
        mask:
        - DoorPassable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
  # _SE start
  - type: Construction
    graph: AtmosDeviceFanDirectional
    node: fanDone
  - type: Pullable
  - type: Anchorable
  # _SE end

# _SE start
- type: entity
  id: AtmosDeviceFanTinyAssembly
  name: fan assembly
  description: A partially constructed fan.
  components:
    - type: Transform
      noRot: false
    - type: Sprite
      sprite: Structures/Piping/Atmospherics/tinyfan.rsi
      state: assembly
      noRot: false
    - type: Anchorable
    - type: Construction
      graph: AtmosDeviceFanTiny
      node: fanFrame
    - type: Clickable
    - type: InteractionOutline
    - type: GravityAffected
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
              bounds: "-0.48,-0.48,0.48,-0.40"
    - type: Pullable
    - type: Tag
      tags:
        - Structure

- type: entity
  id: AtmosDeviceFanDirectionalAssembly
  name: directional fan assembly
  description: A partially constructed directional fan.
  parent: BaseStructure
  components:
    - type: Transform
      noRot: false
    - type: Sprite
      sprite: Structures/Piping/Atmospherics/directionalfan.rsi
      state: assembly
      noRot: false
    - type: Anchorable
    - type: Construction
      graph: AtmosDeviceFanDirectional
      node: fanFrame
    - type: Clickable
    - type: GravityAffected
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
              bounds: "-0.48,-0.48,0.48,-0.40"
    - type: Pullable
    - type: Tag
      tags:
        - Structure
# _SE end
