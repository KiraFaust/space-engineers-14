- type: entity
  abstract: true
  id: BaseVendingDispenserFrame
  name: vending dispenser frame
  description: A vending machine dispenser under construction.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.4,0.3,0.35"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Construction
    graph: VendingDispenser
    node: dispenserFrame
    defaultTarget: dispenser
    containers:
    - board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _SE/Objects/Devices/vending_dispenser.rsi
    state: frame
    snapCardinals: true

- type: entity
  parent: BaseVendingDispenserFrame
  id: VendingDispenserFrame
  components:
  - type: Construction
    node: dispenserFrame

- type: entity
  parent: BaseVendingDispenserFrame
  id: VendingDispenserFrameWired
  suffix: Wired
  components:
  - type: Construction
    node: dispenserWires
  - type: Sprite
    state: wires

- type: entity
  parent: BaseItem
  id: VendingDispenser
  name: vending dispenser
  description: A heavy vending mechanism. Goes inside a vending machine frame.
  components:
  - type: Sprite
    sprite: _SE/Objects/Devices/vending_dispenser.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _SE/Objects/Devices/vending_dispenser.rsi
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: Tag
    tags:
    - VendingDispenser
  - type: Construction
    graph: VendingDispenser
    node: dispenser
    containers:
    - board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
