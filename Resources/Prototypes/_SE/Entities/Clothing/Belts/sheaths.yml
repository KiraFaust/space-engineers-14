  components:
  - type: Sprite
    sprite: _SE/Clothing/Belts/Sheaths/faust_dirk_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _SE/Clothing/Belts/Sheaths/faust_dirk_sheath.rsi
  - type: Item
    size: Ginormous
    shape:
