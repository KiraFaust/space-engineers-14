- type: entity
  abstract: true
  id: BaseVendingMachineFrame
  name: vending machine frame
  description: A vending machine under construction.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.25,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Construction
    graph: VendingMachineFrame
    node: mainFrame
    defaultTarget: vendingMachine
    containers:
    - machine_board
    - machine_parts
    - vending_dispenser
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      vending_dispenser: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: destroyed
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _SE/Structures/Machines/vending_frame.rsi
    state: main_frame
    snapCardinals: true

- type: entity
  parent: BaseVendingMachineFrame
  id: VendingMachineFrame
  suffix: Empty
  components:
  - type: Construction
    node: mainFrame
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: BaseVendingMachineFrame
  id: VendingMachineFrameWired
  suffix: Wired
  components:
  - type: Construction
    node: mainFrameWires
  - type: Sprite
    state: main_frame_wires

- type: entity
  parent: BaseVendingMachineFrame
  id: VendingMachineFrameDispenser
  suffix: Dispenser
  components:
  - type: Construction
    node: mainFrameDispenser
  - type: Sprite
    state: main_frame_vending

- type: entity
  parent: BaseVendingMachineFrame
  id: VendingMachineFrameBoard
  suffix: Board
  components:
  - type: Construction
    node: mainFrameBoard
  - type: Sprite
    state: main_frame_vending_wires

- type: entity
  parent: BaseStructureDynamic
  id: VendingMachineFrameDestroyed
  name: destroyed vending machine frame
  description: What is left of a vending machine frame. Can be cut apart with a welder.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: VendingMachineFrame
    node: destroyed
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _SE/Structures/Machines/vending_frame.rsi
    state: main_frame_destroyed
    snapCardinals: true
