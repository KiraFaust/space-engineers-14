
- type: entity
  id: CommandTechFab
  parent: BaseLatheLube
  name: command techfab
  description: Supreme commander of all techfabs. Prints stuff for Command.
  components:
  - type: Sprite
    sprite: _SE/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: com
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - CommandClothingStatic
     # - IdCardsStatic
     # - PdaStatic
    - BureaucracyStatic
    # dynamicPacks:
    # - PortableTechnologyDinamic
  - type: Machine
    board: CommandTechFabCircuitboard
  - type: StealTarget
    stealGroup: CommandTechFabCircuitboard
  - type: OreSiloClient
  - type: LatheAnnouncing
    channels: [Command]
