- type: entity
  id: GirderDiagonal
  parent: Girder
  name: diagonal girder
  suffix: Diagonal
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: Construction
    graph: GirderDiagonal
    node: girderDiagonal
  - type: Sprite
    sprite: _SE/Structures/Walls/diagonalgirder.rsi
    state: diagonal_girder

- type: entity
  parent: ReinforcedGirder
  id: ReinforcedGirderDiagonal
  name: reinforced diagonal girder
  suffix: Diagonal
  components:
  - type: Sprite
    sprite: _SE/Structures/Walls/diagonalgirder.rsi
    state: diagonal_reinforced_girder
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: Construction
    graph: GirderDiagonal
    node: reinforcedGirderDiagonal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 1
  - type: StaticPrice
    price: 130
