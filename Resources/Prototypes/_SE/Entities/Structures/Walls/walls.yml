- type: entity
  parent: WallShuttleDiagonal
  id: WallRivetedDiagonal
  name: riveted wall
  suffix: diagonal
  description: Skub knows this wall is too hard to destroy.
  components:
  - type: Occluder
    enabled: false
  - type: Sprite
    drawdepth: Walls
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
    color: "#ffffff"
  - type: Icon
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            Girder:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: StaticPrice
    price: 250
