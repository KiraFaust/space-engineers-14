- type: entity
  parent: WallShuttleDiagonal
  id: WallRivetedDiagonal
  name: riveted wall
  suffix: diagonal
  description: Skub knows this wall is too hard to destroy.
  components:
  - type: Occluder
    enabled: false
  - type: Sprite
    drawdepth: Walls
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
    color: "#ffffff"
  - type: Icon
    sprite: _SE/Structures/Walls/riveted_diagonal.rsi
    state: state0
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            GirderDiagonal:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: StaticPrice
    price: 490
  - type: Construction
    graph: GirderDiagonal
    node: diagonalRivetedWall

- type: entity
  parent: BaseWall
  id: WallKrissReinforced
  name: reinforced wall
  components:
  - type: Sprite
    sprite: _SE/Structures/Walls/Krisswall.rsi
  - type: Icon
    sprite: _SE/Structures/Walls/Krisswall.rsi
    state: rgeneric
  - type: Construction
    graph: Girder
    node: krissReinforcedWall
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: reinf_over
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 230
  - type: RadiationBlocker
    resistance: 5

