- type: entity
  parent: BaseWall
  id: ADTwallmarble
  name: marble wall
  description: wall, but marble... Woah
  components:
    - type: Sprite
      sprite: _ADT/Structures/Walls/marble_wall.rsi
    - type: Icon
      sprite: _ADT/Structures/Walls/marble_wall.rsi
    - type: IconSmooth
      key: walls
      # _SE start
      states:
      - !type:CornerSpriteSmoothing
        mask: [ walls, windows, grilles, marble, doors ]
        base: state
      # _SE end
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                Girder:
                  min: 1
                  max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
